name: Publish to GitHub Packages

# The package is published to npmjs.com as `tortoisegate` by hand (npm requires the owner's 2FA).
# This workflow also publishes it to GitHub Packages as `@abdulmunafz/tortoisegate`, so it is
# listed on the repository page. GitHub Packages requires a scope that matches the owner.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v0.1.0
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: publish @abdulmunafz/tortoisegate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@abdulmunafz'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/build-package.mjs
      - name: Rename for GitHub Packages and publish
        working-directory: release/tortoisegate
        run: |
          npm pkg set name=@abdulmunafz/tortoisegate
          npm pkg set publishConfig.registry=https://npm.pkg.github.com
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
