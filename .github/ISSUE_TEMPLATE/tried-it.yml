name: I tried Tortoise Gate
description: Tell us how it went. Every answer helps, short ones too.
title: 'Tried it: '
labels: ['feedback']
body:
  - type: markdown
    attributes:
      value: Thanks for trying Tortoise Gate. Please do not paste secrets, keys or private data.
  - type: dropdown
    id: what
    attributes:
      label: What did you run?
      options:
        - npx tortoisegate demo
        - tortoisegate wrap in front of my own MCP server
        - Both
        - Something else
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Which agent or MCP client and server?
      placeholder: Claude Code with a GitHub MCP server
  - type: dropdown
    id: worked
    attributes:
      label: Did it work?
      options:
        - Yes
        - Partly
        - No
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: What happened, and what would make it more useful?
  - type: input
    id: platform
    attributes:
      label: OS and Node.js version
      placeholder: macOS 26, Node 24.22
