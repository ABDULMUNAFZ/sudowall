# SudoWall policy for the official Dodo Payments MCP server (npm `dodopayments-mcp`, or
# `npx mcp-remote https://mcp.dodopayments.com/mcp`). Its `execute` tool runs TypeScript against
# the Dodo Payments SDK, so this policy reads that code before it runs:
#
# - a plain read runs without asking, but only when the code is parsed and proven to be one:
#   `async function run(client)` whose every call is `client.<resource>.list(query)` or
#   `client.<resource>.retrieve(id)` on the resources listed below, with literal arguments, and
#   with no value copied from untrusted content;
# - every other `execute` call asks you first, including code that does not parse or that the
#   check cannot follow (aliases, bracket access, loops, eval, fetch, ...);
# - code that would change something using an email, URL or amount copied from untrusted content
#   (a support ticket, an email, a web page) is blocked.
#
# Also give the server a restricted API key and keep it in test mode while you try it
# (DODO_PAYMENTS_ENVIRONMENT=test_mode).
#
# `execute` is not a sink, so if this policy cannot be evaluated for a call (for example `code` is
# missing), the verdict comes from `failure.onPolicyErrorNonSink` in config.json. `sudowall init
# --template dodo-payments` sets it to `block`; with `allow`, SudoWall warns when it starts.
schema: sudowall/policy@1
name: dodo-payments
version: 3

defaults:
  sink: ask
  other: allow

rules:
  - id: block-untrusted-value-in-dodo-write
    description: Code that changes payments or customers uses a value copied from untrusted content
    match: { tool: 'execute' }
    when:
      all:
        - path: /code
          provenance: { label: untrusted }
        - any:
            - { path: /code, glob: '*.create*' }
            - { path: /code, glob: '*.update*' }
            - { path: /code, glob: '*.delete*' }
            - { path: /code, glob: '*.charge*' }
            - { path: /code, glob: '*.changePlan*' }
            - { path: /code, glob: '*.cancel*' }
            - { path: /code, glob: '*.archive*' }
            - { path: /code, glob: '*.unarchive*' }
            - { path: /code, glob: '*.activate*' }
            - { path: /code, glob: '*.deactivate*' }
            - { path: /code, glob: '*.ingest*' }
            - { path: /code, glob: '*[*' }
            - { path: /code, glob: '*eval*' }
            - { path: /code, glob: '*Function*' }
            - { path: /code, glob: '*Reflect*' }
            - { path: /code, glob: '*import*' }
            - { path: /code, glob: '*require*' }
            - { path: /code, glob: '*fetch*' }
    action: block
    reason: 'The code would change payments or customers using an email, URL or amount copied from untrusted content.'

  - id: allow-proven-dodo-read
    description: Code that is proven to only list or retrieve, with no untrusted values
    match: { tool: 'execute' }
    # ask-dodo-execute below has exactly this condition under `not` (a test keeps them equal).
    when:
      all:
        - path: /code
          sdk_read_only:
            resources:
              [
                payments,
                subscriptions,
                customers,
                refunds,
                disputes,
                payouts,
                products,
                discounts,
                addons,
                brands,
                meters,
                usageEvents,
              ]
        - not: { path: /code, provenance: { label: untrusted } }
    action: allow
    reason: 'The code only lists or retrieves Dodo Payments records (checked by parsing it), with no value from untrusted content.'

  - id: ask-dodo-execute
    description: Any other code the agent wants to run against the Dodo Payments API
    match: { tool: 'execute' }
    when:
      not:
        all:
          - path: /code
            sdk_read_only:
              resources:
                [
                  payments,
                  subscriptions,
                  customers,
                  refunds,
                  disputes,
                  payouts,
                  products,
                  discounts,
                  addons,
                  brands,
                  meters,
                  usageEvents,
                ]
          - not: { path: /code, provenance: { label: untrusted } }
    action: ask
    reason: 'This code runs against your Dodo Payments account and can move money or change customers or settings. Check it before it runs.'
