# SudoWall policy for the official Dodo Payments MCP server (npm `dodopayments-mcp`, or
# `npx mcp-remote https://mcp.dodopayments.com/mcp`). Its `execute` tool runs TypeScript against
# the Dodo Payments SDK, so this policy reads that code before it runs:
#
# - every `execute` call asks you first, read-only or not: code text cannot prove that code is
#   harmless (a comment can mention `.list(`, a computed property can hide `.create(`), so the
#   policy never relaxes on what the code appears to do;
# - code that would change something using an email, URL or amount copied from untrusted content
#   (a support ticket, an email, a web page) is blocked.
#
# The patterns below only ever make a decision stricter (ask -> block). Code that evades them
# still asks. Also give the server a restricted API key and keep it in test mode while you try
# it (DODO_PAYMENTS_ENVIRONMENT=test_mode).
schema: sudowall/policy@1
name: dodo-payments
version: 2

defaults:
  sink: ask
  other: allow

rules:
  - id: block-untrusted-value-in-dodo-write
    description: Code that changes payments or customers uses a value copied from untrusted content
    match: { tool: 'execute' }
    when:
      all:
        - path: /code
          provenance: { label: untrusted }
        - any:
            - { path: /code, glob: '*.create*' }
            - { path: /code, glob: '*.update*' }
            - { path: /code, glob: '*.delete*' }
            - { path: /code, glob: '*.charge*' }
            - { path: /code, glob: '*.changePlan*' }
            - { path: /code, glob: '*.cancel*' }
            - { path: /code, glob: '*.archive*' }
            - { path: /code, glob: '*.unarchive*' }
            - { path: /code, glob: '*.activate*' }
            - { path: /code, glob: '*.deactivate*' }
            - { path: /code, glob: '*.ingest*' }
            - { path: /code, glob: '*[*' }
            - { path: /code, glob: '*eval*' }
            - { path: /code, glob: '*Function*' }
            - { path: /code, glob: '*Reflect*' }
            - { path: /code, glob: '*import*' }
            - { path: /code, glob: '*require*' }
            - { path: /code, glob: '*fetch*' }
    action: block
    reason: 'The code would change payments or customers using an email, URL or amount copied from untrusted content.'

  - id: ask-dodo-execute
    description: Any code the agent wants to run against the Dodo Payments API
    match: { tool: 'execute' }
    action: ask
    reason: 'This code runs against your Dodo Payments account and can move money or change customers or settings. Check it before it runs.'
